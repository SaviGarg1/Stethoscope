<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lung Sound Classifier</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #1E90FF;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-sizing: border-box;
        }

        header {
            width: 100%;
            padding: 20px 16px;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0, 0, 128, 0.2);
            backdrop-filter: blur(8px);
        }

        header h1 {
            margin: 0;
            font-size: 1.6rem;
        }

        form {
            margin-top: 100px;
            display: grid;
            gap: 16px;
        }

        input[type="file"] {
            color: #fff;
        }

        button {
            background: #003f8a;
            border: none;
            color: white;
            padding: 14px 18px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 6px;
        }

        .result, .error {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .result {
            background: rgba(255, 255, 255, 0.16);
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <header>
        <h1>Arduino Based Respirator Stethoscope</h1>
    </header>
    <main>
        <p>Upload a .wav lung sound file and get a single diagnosis result.</p>

        <form method="post" enctype="multipart/form-data">
            <input type="file" name="audio_file" accept=".wav" required>
            <button type="submit">Submit</button>
        </form>

        {% if result %}
            <div class="result">Prediction: <strong>{{ result }}</strong></div>
        {% endif %}

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </main>
</body>
</html>
